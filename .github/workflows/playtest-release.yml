# Playtest builds. Every push to main tests and packages Windows, Linux and macOS as a check
# (packages kept as workflow artifacts, nothing published). Pushing a tag v<Version> (the
# <Version> in Directory.Build.props, with a section for it in docs/alpha/CHANGELOG.md) publishes:
# the packages go to the restricted itch.io page through butler, and Discord's #builds hears
# about it. Running it by hand (workflow_dispatch) with "publish" ticked republishes the current
# <Version> from that branch. docs/alpha/PUBLISHING.md has the one-time setup and the release steps.
#
# Every platform is packaged in one Linux job on purpose: co-op only connects builds with the same
# build tag, which hashes the game assemblies, so they must come from one compiler run
# (tools/package.sh checks that they're identical).
name: Playtest release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to itch.io and announce on Discord"
        type: boolean
        default: false

# One run per ref at a time, in push order; a running publish finishes rather than being cancelled
# halfway through.
concurrency:
  group: playtest-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ env.PUBLISH }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # A private engine repo needs a token with read access to jraynard/narsil.
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Version
        id: version
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)"
          [[ -n "$version" ]] || { echo "::error::no <Version> in Directory.Build.props"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} doesn't match <Version> $version in Directory.Build.props"; exit 1
          fi
          if [[ "$PUBLISH" == "true" ]]; then
            grep -qxF "## $version" docs/alpha/CHANGELOG.md \
              || { echo "::error::docs/alpha/CHANGELOG.md has no '## $version' section"; exit 1; }
          else
            version="$version-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A red test blocks the release (Release config; the scenario tests dominate).
      - name: Test
        run: dotnet test -c Release

      # The placeholder music isn't in git: tools/package.sh fetches it (tools/fetch_music.py),
      # cached here so every push doesn't download it again.
      - name: ffmpeg
        run: command -v ffmpeg > /dev/null || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)

      - uses: actions/cache@v4
        with:
          path: data/sounds/music/free
          key: music-${{ hashFiles('tools/fetch_music.py') }}

      - name: Package
        run: DW_NO_SHARE=1 tools/package.sh "${{ steps.version.outputs.version }}"

      - name: Release notes
        run: |
          version="${{ steps.version.outputs.version }}"
          # This version's section of the changelog (none for a dev build).
          awk -v v="## ${version%-dev.*}" '$0 == v {on = 1; next} /^## / && on {exit} on' docs/alpha/CHANGELOG.md > dist/notes.md
          cat dist/notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/notes.md
            dist/version.txt

  windows-smoke:
    # The packages are built on Linux: make sure the Windows one starts on Windows (native DLLs, data).
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
      - name: Headless checks
        shell: pwsh
        run: |
          $zip = Get-ChildItem *win-x64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath pkg
          $exe = Get-ChildItem pkg -Recurse -Filter HeroesNotIncluded.exe | Select-Object -First 1
          & $exe.FullName --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe.FullName --check-art
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Same build tag as the Linux package, or co-op between them would be refused.
          $tag = (& $exe.FullName --version | Select-String 'build tag').ToString()
          $linux = (Get-Content version.txt | Select-String 'build tag').ToString()
          if ($tag.Trim() -ne $linux.Trim()) { Write-Error "build tag differs: '$tag' vs '$linux'"; exit 1 }

  macos-sign:
    # The Mac package is built on Linux too: here it gets an ad-hoc signature over the whole .app
    # (Apple Silicon refuses broken or partial signatures), then the same headless checks. Signing
    # seals the bundle without touching the DLLs, so the build tag stays the Linux package's.
    # A copy without extended attributes is checked too: that's how it reaches testers.
    # Only for a publish: macOS runner minutes cost ten times Linux's on a private repo.
    needs: package
    if: needs.package.outputs.publish == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
      - name: Sign and check
        run: |
          set -euo pipefail
          tarball="$(ls *-osx-arm64.tar.gz)"
          folder="${tarball%.tar.gz}"
          tar -xzf "$tarball"
          app="$folder/HeroesNotIncluded.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          exe="$app/Contents/MacOS/HeroesNotIncluded"
          "$exe" --version
          "$exe" --check-art
          # Vulkan through the bundled MoltenVK (a hosted runner may have no Metal GPU: report only).
          "$exe" --check-gpu || echo "::warning::--check-gpu found no Vulkan GPU on this runner"
          tag="$("$exe" --version | grep 'build tag')"
          linux="$(grep 'build tag' version.txt)"
          [[ "$tag" == "$linux" ]] || { echo "::error::build tag differs: '$tag' vs '$linux'"; exit 1; }
          # The app as testers get it: the itch job unpacks it on Linux and butler keeps only file
          # contents, so no extended attributes. The signature must hold without them.
          ditto --noextattr --noqtn --noacl "$app" travelled/HeroesNotIncluded.app
          codesign --verify --deep --strict --verbose=2 travelled/HeroesNotIncluded.app
          travelled/HeroesNotIncluded.app/Contents/MacOS/HeroesNotIncluded --version
          rm -rf travelled
          rm "$tarball"
          # No AppleDouble ._ files: unpacked on Linux they'd be stray files inside the sealed bundle.
          COPYFILE_DISABLE=1 tar -czf "$tarball" "$folder"
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: "*-osx-arm64.tar.gz"

  itch:
    # Unpacked folders go up, not the archives, so the itch app downloads only what changed.
    needs: [package, windows-smoke, macos-sign]
    if: needs.package.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ vars.ITCH_TARGET }}
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
      # The signed Mac package replaces the unsigned one.
      - uses: actions/download-artifact@v4
        with:
          name: package-macos
      - name: Install butler
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler -V
      - name: Push
        run: |
          set -euo pipefail
          [[ -n "$BUTLER_API_KEY" && -n "$ITCH_TARGET" ]] \
            || { echo "::error::set the BUTLER_API_KEY secret and ITCH_TARGET variable (docs/alpha/PUBLISHING.md)"; exit 1; }
          mkdir -p up/windows up/linux up/mac
          unzip -q *-win-x64.zip -d up/windows
          tar -xzf *-linux-x64.tar.gz -C up/linux
          tar -xzf *-osx-arm64.tar.gz -C up/mac
          # The Mac signature needs its symlinks intact and nothing extra in the bundle (tools/package.sh).
          [[ -z "$(find up/mac -name '._*')" ]] || { echo "::error::AppleDouble ._ files in the Mac package"; exit 1; }
          [[ -L "$(find up/mac -maxdepth 2 -name HeroesNotIncluded.app)/Contents/MacOS/data" ]] \
            || { echo "::error::the Mac app's Contents/MacOS/data isn't a symlink"; exit 1; }
          for channel in windows linux mac; do
            # Each archive holds one folder; push its contents.
            dir="$(find "up/$channel" -mindepth 1 -maxdepth 1 -type d | head -1)"
            butler/butler push "$dir" "$ITCH_TARGET:$channel" --userversion "$VERSION"
          done

  discord:
    needs: [package, itch]
    if: needs.package.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ITCH_TARGET: ${{ vars.ITCH_TARGET }}
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
      - name: Announce
        run: |
          set -euo pipefail
          [[ -n "$WEBHOOK" ]] || { echo "::warning::no DISCORD_WEBHOOK_URL secret: not announcing"; exit 0; }
          user="${ITCH_TARGET%%/*}"; game="${ITCH_TARGET#*/}"
          url="https://$user.itch.io/$game"
          # An embed's description holds 4096 characters; leave room for the footer lines.
          notes="$(head -c 3500 notes.md)"
          body="$(jq -n --arg v "$VERSION" --arg url "$url" --arg notes "$notes" '{
            username: "Heroes Not Included",
            embeds: [{
              title: ("Playtest build " + $v),
              url: $url,
              color: 14856256,
              description: ($notes + "\n\n**Get it:** the itch app updates by itself, or download it from the page.\nEveryone in a game needs this same version.")
            }]
          }')"
          curl -fsS -H "Content-Type: application/json" -d "$body" "$WEBHOOK"
